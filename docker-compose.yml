version: '3.8'

services:
  server:
    build: ./server
    container_name: server
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env
    environment:
      - PORT=3000

  client:
    build: ./client
    container_name: client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server
